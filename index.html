<!DOCTYPE html>
<html lang="zh-TW" data-theme="blue-white" data-font-size="medium">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>五心計畫 KPI - 雲端版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Supabase 雲端連線套件 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f8ff; color: #334155; }
        .theme-card { background-color: #ffffff; border: 1px solid #bae6fd; }
        .theme-subcard { background-color: #e0f2fe; border: 1px solid #bae6fd; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 登入與註冊畫面 -->
    <div id="auth-screen" class="theme-card w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-sky-100 text-sky-600 p-3 rounded-2xl shadow-sm border border-sky-200 font-extrabold text-2xl inline-flex items-center justify-center w-14 h-14 mx-auto mb-2">💎</div>
            <h1 class="text-2xl font-extrabold text-slate-900">五心計畫 KPI</h1>
            <p class="text-sm text-slate-500 font-bold">團隊專屬行動儀表板</p>
        </div>

        <form id="login-form" class="space-y-4" onsubmit="handleAuth(event)">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">電子郵件 (Email)</label>
                <input type="email" id="auth-email" required class="w-full theme-subcard rounded-xl p-3 text-slate-900 outline-none font-bold" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">密碼</label>
                <input type="password" id="auth-password" required class="w-full theme-subcard rounded-xl p-3 text-slate-900 outline-none font-bold" placeholder="••••••••">
            </div>
            
            <!-- 註冊專用：團隊邀請碼 (登入時會隱藏) -->
            <div id="invite-code-group" class="hidden">
                <label class="block text-sm font-bold text-slate-700 mb-1">團隊邀請碼</label>
                <input type="text" id="auth-invite-code" class="w-full theme-subcard rounded-xl p-3 text-slate-900 outline-none font-bold placeholder-rose-400" placeholder="向管理員索取邀請碼">
            </div>

            <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg py-3 rounded-xl shadow-lg transition-transform active:scale-95">登入系統</button>
        </form>

        <div class="text-center text-sm font-bold">
            <button type="button" onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-indigo-600 hover:underline">還沒有帳號？點此註冊</button>
        </div>
    </div>

    <!-- 系統載入中畫面 -->
    <div id="loading-screen" class="hidden text-center space-y-3">
        <div class="animate-spin text-4xl">⏳</div>
        <p class="font-bold text-slate-600">正在與 Supabase 雲端金庫連線...</p>
    </div>

    <script>
        // ==========================================
        // 🔑 步驟三：請在這裡貼上您的 Supabase 專屬鑰匙
        // ==========================================
        
        const SUPABASE_URL = 'https://ojvzzhzrbvmdtogxokwr.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_Oy9tndWgGKhUXaL51fOvaQ_zmoUGdJI';
        
        // 團隊註冊邀請碼 (防止外人註冊，您可以自己修改密語)
        const TEAM_INVITE_CODE = 'kpimyself-336'; 

        // ==========================================

        let supabase;
        let isLoginMode = true;

        // 初始化 Supabase 連線
        if(SUPABASE_URL && SUPABASE_URL !== '請將這串文字替換成您的_Project_URL') {
            supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // 切換登入 / 註冊模式
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-submit-btn').textContent = isLoginMode ? '登入系統' : '註冊帳號';
            document.getElementById('auth-toggle-btn').textContent = isLoginMode ? '還沒有帳號？點此註冊' : '已有帳號？返回登入';
            document.getElementById('invite-code-group').classList.toggle('hidden', isLoginMode);
            if(!isLoginMode) document.getElementById('auth-invite-code').setAttribute('required', 'true');
            else document.getElementById('auth-invite-code').removeAttribute('required');
        }

        // 處理登入與註冊邏輯
        async function handleAuth(e) {
            e.preventDefault();
            if(!supabase) return alert('🚨 錯誤：您還沒有填入 Supabase 的 URL 與 Key！');

            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('loading-screen').classList.remove('hidden');

            if (isLoginMode) {
                // 執行登入
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert('登入失敗：' + error.message);
                    resetAuthScreen();
                } else {
                    alert('🎉 登入成功！(接下來會載入主系統畫面...)');
                    // TODO: 登入成功後，載入完整的主系統畫面與資料
                }
            } else {
                // 執行註冊
                const inviteCode = document.getElementById('auth-invite-code').value;
                if (inviteCode !== TEAM_INVITE_CODE) {
                    alert('🚨 團隊邀請碼錯誤，無法註冊！');
                    resetAuthScreen();
                    return;
                }
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    alert('註冊失敗：' + error.message);
                } else {
                    alert('✅ 註冊成功！我們已經發送了一封驗證信到您的信箱，請去收信點擊連結驗證。');
                }
                resetAuthScreen();
            }
        }

        function resetAuthScreen() {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('loading-screen').classList.add('hidden');
        }
    </script>
</body>
</html>
