# 每隔 3 天對 Supabase 送一次輕量請求，避免免費專案因長時間沒有活動被暫停。
# 網址與金鑰直接讀取 index.html 裡的設定（那把是公開的 publishable key），不用另外設定 Secrets。
name: Supabase keep-alive
 
on:
  schedule:
    - cron: '17 3 */3 * *'   # 每 3 天一次（UTC 03:17，台灣時間 11:17）
  workflow_dispatch:         # 也可以在 Actions 頁面手動按「Run workflow」測試
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" index.html)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" index.html)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "找不到 Supabase 設定"; exit 1; fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            "$URL/rest/v1/profiles?select=id&limit=1")
          echo "Supabase 回應狀態碼：$CODE"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then exit 1; fi
